<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Browse 15 popular Ghanaian dishes with ingredients, regions, meal times, and descriptions.">
    <meta name="author" content="Boateng Eric">
    <meta property="og:title" content="Ghanaian Food Guide">
    <meta property="og:description" content="Browse Ghanaian dishes and save your favorites.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/ghanafoodshero.webp">
    <title>Ghanaian Local Food Guide | Food Guide</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/large.css">
    <script type="module" src="scripts/guide.js"></script>
  </head>

  <body>
    <header>
      <nav class="site-nav">
        <a class="brand" href="index.html">
          <img src="images/favicon.svg" alt="" width="36" height="36">
          <span>Ghanaian Local Food Guide</span>
        </a>
        <button id="menu-button" class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
        <ul id="primary-nav" class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="guide.html" aria-current="page">Food Guide</a></li>
          <li><a href="suggest.html">Suggestions</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page-title">
        <h1>Food Guide</h1>
        <p>Browse local Ghanaian foods and use the buttons to view details or save favorites.</p>
      </section>

      <section class="toolbar" aria-label="Food filters">
        <label for="region-filter">Filter by region</label>
        <select id="region-filter">
          <option value="all">All regions</option>
          <option value="Greater Accra">Greater Accra</option>
          <option value="Ashanti">Ashanti</option>
          <option value="Northern Ghana">Northern Ghana</option>
          <option value="Volta">Volta</option>
          <option value="Central">Central</option>
        </select>
        <button id="favorites-filter" class="secondary-button" type="button">Show Favorites</button>
      </section>

      <section aria-labelledby="foods-title">
        <h2 id="foods-title">Popular Foods</h2>
        <p id="food-count" class="count"></p>
        <div id="food-list" class="food-grid"></div>
      </section>

      <dialog id="food-dialog" aria-labelledby="dialog-title">
        <div class="dialog-content">
          <button id="close-dialog" class="close-button" type="button" aria-label="Close food details">X</button>
          <img id="dialog-image" src="images/jollofrice.webp" alt="" width="640" height="400">
          <h2 id="dialog-title"></h2>
          <p id="dialog-description"></p>
          <dl>
            <div>
              <dt>Region</dt>
              <dd id="dialog-region"></dd>
            </div>
            <div>
              <dt>Ingredients</dt>
              <dd id="dialog-ingredients"></dd>
            </div>
            <div>
              <dt>Meal Time</dt>
              <dd id="dialog-meal"></dd>
            </div>
          </dl>
        </div>
      </dialog>
    </main>

    <footer>
      <p>&copy; <span id="currentyear"></span> Ghanaian Local Food Guide</p>
      <p>Last modified: <span id="lastmodified"></span></p>
      <p><a href="attributions.html">Attributions</a> | <a href="https://www.loom.com/share/7cf349c717db4cc1b7c6035f0f7c5210" target="_blank"
          rel="noopener">Video Demo</a></p>
    </footer>
  </body>

</html>
